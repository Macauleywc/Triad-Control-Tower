input:focus { border-color: #E8520A; }
.btn { width: 100%; padding: 13px; background: #121932; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn:hover { background: #1a2744; }
.btn:disabled { background: #8090b0; cursor: not-allowed; }
.progress-wrap { margin-top: 20px; display: none; }
.progress-label { font-size: 13px; color: #404860; margin-bottom: 8px; }
.progress-bar { background: #e4e6ed; border-radius: 6px; height: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: #E8520A; border-radius: 6px; transition: width .3s; width: 0%; }
.log { margin-top: 16px; background: #f4f5f8; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; max-height: 200px; overflow-y: auto; color: #404860; }
.success { color: #1a7a4a; font-weight: 700; font-size: 15px; text-align: center; padding: 16px; }
.error { color: #c0392b; font-size: 12px; }
.note { font-size: 12px; color: #8090b0; margin-top: 12px; line-height: 1.6; }

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function startUpload() {
  const url = document.getElementById('sb-url').value.trim();
  const key = document.getElementById('sb-key').value.trim();
  if (!url || !key) { alert('Please enter your Supabase URL and anon key'); return; }

  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  btn.textContent = 'Uploading...';

  const wrap = document.getElementById('progress-wrap');
  wrap.style.display = 'block';

  const sb = supabase.createClient(url, key);

  const BATCH = 5;
  let done = 0, errors = 0;

  for (let i = 0; i < DATA.length; i += BATCH) {
    const batch = DATA.slice(i, i + BATCH);

    for (const plan of batch) {
      try {
        const { error } = await sb.from('daily_plans').upsert({
          site_id: plan.site_id,
          plan_date: plan.plan_date,
          capacity: plan.capacity,
          notes: plan.notes,
          uploaded_by: plan.uploaded_by,
          total_loads: plan.total_loads,
          total_trailers: plan.total_trailers,
          routes: plan.routes
        }, { onConflict: 'site_id,plan_date' });

        if (error) {
          log(`✗ ${plan.plan_date}: ${error.message}`, 'error');
          errors++;
        } else {
          done++;
          log(`✓ ${plan.plan_date} — ${plan.routes.length} runs`);
        }
      } catch(e) {
        log(`✗ ${plan.plan_date}: ${e.message}`, 'error');
        errors++;
      }
    }

    // Update progress
    const pct = Math.round((i + batch.length) / DATA.length * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = `Uploading... ${i + batch.length} / ${DATA.length} days (${pct}%)`;

    // Small delay to avoid rate limiting
    await new Promise(r => setTimeout(r, 200));
  }

  document.getElementById('progress-label').textContent = `Complete — ${done} days uploaded, ${errors} errors`;
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-fill').style.background = errors > 0 ? '#c0392b' : '#1a7a4a';
  btn.textContent = 'Done!';

  if (done > 0) {
    log(`\n✅ ${done} days successfully imported to Supabase`, 'success');
    log(`Refresh the Triad Control Tower app and navigate to any date in this range.`);
  }
}
